[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chapterize"
version = "0.1.0"
description = "Convert long audio files into chaptered, open-source audiobooks (Opus in Matroska). Cross-platform CLI + GUI for macOS and Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Chester Frazier" }]
keywords = ["audiobook", "chapters", "opus", "matroska", "ffmpeg", "m4b"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = []

[project.scripts]
chapterize = "chapterize.cli:main"

[project.gui-scripts]
chapterize-gui = "chapterize.gui:main"

[project.urls]
Homepage = "https://github.com/cwfrazier1/chapterize"

[tool.setuptools]
packages = ["chapterize"]
